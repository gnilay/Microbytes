<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{POST_TITLE}} | {{COMPANY_NAME}}</title>
  <meta name="description" content="{{POST_SUMMARY}}">
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
</head>
<body>

  <!-- Copy this file to e.g. blog/plain-language-patient-materials.html and fill it in. -->

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html">
        <img class="brand-mark" src="../images/logo-52.png" srcset="../images/logo-104.png 2x, ../images/logo-156.png 3x" alt="" width="52" height="52">
        <span class="brand-name">{{COMPANY_NAME}}</span>
      </a>
      <nav aria-label="Main">
        <ul class="nav-links">
          <li><a href="../index.html#about">About us</a></li>
          <li><a href="../index.html#services">Services</a></li>
          <li><a href="../index.html#blog">Blog</a></li>
          <li><a class="btn btn-primary btn-sm" href="../index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container post">
    <p class="eyebrow">{{POST_CATEGORY}}</p>
    <h1>{{POST_TITLE}}</h1>
    <p class="post-meta">{{POST_DATE}} · {{AUTHOR_NAME}}</p>

    <p>{{POST_BODY}}</p>

    <p><a href="../index.html#blog">← Back to the Journal</a></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>© <strong>{{COMPANY_NAME}}</strong> {{YEAR}} · Let’s communicate science effectively</p>
      <p><a href="mailto:{{EMAIL}}">{{EMAIL}}</a> · <a href="tel:{{PHONE}}">{{PHONE}}</a></p>
    </div>
  </footer>

</body>
</html>
